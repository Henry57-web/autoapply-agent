name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autoapply_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autoapply_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/autoapply_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/autoapply_test
      LLM_PROVIDER: test
      LLM_API_KEY: dummy
      LLM_MODEL: mock
      GMAIL_CLIENT_ID: dummy
      GMAIL_CLIENT_SECRET: dummy
      GMAIL_REDIRECT_URI: http://127.0.0.1:8000/api/v1/gmail/oauth/callback
      GMAIL_TOKEN_ENCRYPTION_KEY: PxQfSe2LIFrf-VFSxC8qIOAVNCzDqcFbTvvQ8EbY0ZY=
      CORS_ORIGINS: '["http://localhost:3000"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Alembic upgrade
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Verify latest migration downgrade and re-upgrade
        working-directory: backend
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Compile backend package
        working-directory: backend
        run: python -m compileall -q app

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
